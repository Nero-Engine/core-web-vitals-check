name: self-test
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node test/run-tests.cjs
  no-key-explains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        uses: ./
        continue-on-error: true
        with:
          urls: example.com
      - name: Expect a clear error when no key is given
        run: test "${{ steps.check.outputs.result }}" = "error"
