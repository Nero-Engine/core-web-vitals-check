# .github/workflows/core-web-vitals.yml
# Tests the first 25 pages of your sitemap every Monday and on every push to main.
# Fails when real visitors fail Core Web Vitals or the mobile score drops under 50.
name: Core Web Vitals
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
jobs:
  cwv:
    runs-on: ubuntu-latest
    steps:
      - uses: Nero-Engine/core-web-vitals-check@v1
        with:
          sitemap: https://www.example.com/sitemap.xml
          max-urls: 25
          google-api-key: ${{ secrets.PAGESPEED_API_KEY }}
          fail-on: any
          min-score: 50
